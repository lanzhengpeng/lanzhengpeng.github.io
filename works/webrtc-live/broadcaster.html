<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主播端 - 小猫直播</title>
    <script>
        (function () {
            const stored = localStorage.getItem('theme');
            const theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/shell.css">
    <link rel="stylesheet" href="css/style.css" data-page-style>
</head>
<body data-route="/works/webrtc-live/broadcaster.html">
    <canvas id="canvas-bg"></canvas>
    <canvas id="boids-canvas"></canvas>
    <audio id="bgm" src="/files/Allard%20Sidonia%20-%20Rain%20Without%20End.mp3" loop preload="metadata"></audio>

    <div class="theme-switch" id="theme-switch" aria-label="切换主题">
        <button aria-label="切换主题">
            <svg class="icon-light" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-dark" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
    </div>

    <div id="app">
        <header class="top-bar">
            <a href="/works/" class="back-link">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                返回作品页
            </a>
        </header>

        <main class="container">
            <img src="../../images/小猫灰灰.svg" alt="" class="hero-cat">
            <h1>小猫直播</h1>
            <p class="subtitle">主播端 —— 轻轻一点，把画面分享给小伙伴</p>

            <div class="card">
                <video id="local-video" autoplay muted playsinline></video>
                <div class="btn-row">
                    <button id="start-btn" class="btn">开始直播</button>
                    <button id="stop-btn" class="btn btn-danger" disabled>停止直播</button>
                </div>
                <div id="status" class="status">等待开始直播...</div>
            </div>

            <div class="card">
                <h2>观众入口</h2>
                <p>用手机扫描二维码，或复制链接在浏览器打开</p>
                <div id="manual-ip-wrap" class="manual-ip-wrap">
                    <p>自动获取局域网 IP 失败，请手动输入电脑的局域网 IP（如 192.168.1.x）：</p>
                    <input id="manual-ip" class="manual-ip-input" type="text" placeholder="192.168.1.x">
                    <button id="apply-ip-btn" class="btn btn-sm">生成二维码</button>
                </div>
                <div class="qr-wrap">
                    <div id="qrcode"></div>
                    <div id="url-text" class="url-text"></div>
                </div>
            </div>

            <ul class="info-list">
                <li>请确保手机和电脑连接同一个 Wi-Fi</li>
                <li>点击“开始直播”后选择要分享的屏幕或窗口</li>
                <li>手机扫码后即可加入观看</li>
            </ul>
        </main>

        <footer>
            <p>&copy; 2026 兰政鹏。</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/broadcaster.js"></script>
</body>
</html>
