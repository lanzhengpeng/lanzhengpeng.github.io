<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小猫直播</title>
    <script>
        (function () {
            const stored = localStorage.getItem('theme');
            const theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
            document.documentElement.dataset.theme = theme;
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/shell.css">
    <link rel="stylesheet" href="css/style.css" data-page-style>
</head>
<body data-route="/works/webrtc-live/">
    <canvas id="canvas-bg"></canvas>
    <canvas id="boids-canvas"></canvas>
    <audio id="bgm" src="/files/Allard%20Sidonia%20-%20Rain%20Without%20End.mp3" loop preload="metadata"></audio>

    <div class="theme-switch" id="theme-switch" aria-label="切换主题">
        <button aria-label="切换主题">
            <svg class="icon-light" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            <svg class="icon-dark" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        </button>
    </div>

    <div id="app">
        <header class="top-bar">
            <a href="/works/" class="back-link">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                返回作品页
            </a>
        </header>

        <main class="container">
            <img src="../../images/小猫灰灰.svg" alt="" class="hero-cat">
            <h1>小猫直播</h1>
            <p class="subtitle">把屏幕画面轻轻分享给身边的朋友</p>

            <div class="card landing-actions">
                <p>无需注册，没有广告。在同一 Wi-Fi 下，即可开播、观看，像小猫一样轻快。</p>
                <div class="btn-row btn-row-center">
                    <a href="broadcaster.html" class="btn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                        我要开播
                    </a>
                    <a href="viewer.html" class="btn">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        我要观看
                    </a>
                </div>
            </div>

            <div class="card">
                <h2>怎么用？</h2>
                <ol class="info-list steps">
                    <li>电脑打开 <a href="broadcaster.html">我要开播</a></li>
                    <li>选择想分享的屏幕或窗口</li>
                    <li>用手机扫描二维码，或把链接发给身边的朋友</li>
                    <li>观众打开 <a href="viewer.html">我要观看</a> 即可看到画面</li>
                </ol>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 兰政鹏。</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>
</html>
