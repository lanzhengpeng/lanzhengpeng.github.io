<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI Chat</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,sans-serif; background:#0f172a; color:#e8edf3; height:100vh; display:flex; flex-direction:column; }
.top-bar { background:#1e293b; padding:12px 16px; display:flex; align-items:center; gap:10px; border-bottom:1px solid #334155; }
.avatar { width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,#7aa9ff,#2563eb); display:flex; align-items:center; justify-content:center; font-size:1rem; }
.top-info h3 { font-size:0.9rem; } .top-info p { font-size:0.7rem; color:#6ee7b7; }
.messages { flex:1; padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:85%; padding:10px 14px; border-radius:16px; font-size:0.8rem; line-height:1.5; }
.msg.user { align-self:flex-end; background:#2563eb; color:#fff; border-bottom-right-radius:4px; }
.msg.bot { align-self:flex-start; background:#1e293b; border:1px solid #334155; border-bottom-left-radius:4px; }
.msg .time { font-size:0.6rem; color:#475569; margin-top:4px; text-align:right; }
.input-bar { background:#1e293b; padding:12px 16px; display:flex; gap:8px; border-top:1px solid #334155; }
.input-bar input { flex:1; background:#0f172a; border:1px solid #334155; border-radius:20px; padding:10px 14px; color:#e8edf3; font-size:0.8rem; outline:none; }
.send-btn { width:40px; height:40px; border-radius:50%; background:#2563eb; border:none; color:#fff; font-size:1rem; cursor:pointer; }
</style></head>
<body>
<div class="top-bar"><div class="avatar">🤖</div><div class="top-info"><h3>AI Assistant</h3><p>● Online</p></div></div>
<div class="messages">
  <div class="msg bot">你好！我是你的 AI 助手，有什么可以帮你的吗？<div class="time">10:20</div></div>
  <div class="msg user">帮我总结一下今天的会议要点<div class="time">10:21</div></div>
  <div class="msg bot">好的，以下是今天会议的三个核心要点：<br>1️⃣ Q3 产品路线图确认<br>2️⃣ 用户增长率提升 15%<br>3️⃣ 下季度重点：AI 功能集成<div class="time">10:21</div></div>
  <div class="msg user">谢谢！<div class="time">10:22</div></div>
  <div class="msg bot">不客气！还有其他需要帮忙的吗？😊<div class="time">10:22</div></div>
</div>
<div class="input-bar"><input placeholder="输入消息..."><button class="send-btn">➤</button></div>
</body></html>
