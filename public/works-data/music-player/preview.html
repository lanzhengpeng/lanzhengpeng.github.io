<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MelodyFlow</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html { height:100%; }
    body { min-height:100%; overflow:auto; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(180deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:clamp(16px,4%,32px); }
    .player { width:100%; max-width:340px; }
    .album-art { width:min(180px,62vw); aspect-ratio:1; border-radius:20px; background:linear-gradient(135deg,#e74c3c,#c0392b,#8e44ad); display:grid; place-items:center; margin:0 auto 20px; box-shadow:0 20px 50px rgba(0,0,0,.5); }
    .album-art svg { width:42%; height:42%; color:#fff; }
    .meta { text-align:center; margin-bottom:20px; }
    .song-title { font-size:clamp(1rem,4.5vw,1.2rem); font-weight:700; margin-bottom:4px; }
    .artist { font-size:.8rem; color:#a0a0b0; }
    .progress { height:5px; border-radius:3px; background:rgba(255,255,255,.12); cursor:pointer; margin-bottom:8px; }
    .progress-fill { width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,#e74c3c,#8e44ad); }
    .time-row { display:flex; justify-content:space-between; font-size:.65rem; color:#a0a0b0; margin-bottom:20px; }
    .controls { display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:20px; }
    button { border:0; background:transparent; color:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
    .ctrl-btn { width:36px; height:36px; opacity:.72; transition:.2s; }
    .ctrl-btn:hover { opacity:1; }
    .play-btn { width:56px; height:56px; border-radius:50%; background:#e74c3c; box-shadow:0 8px 20px rgba(231,76,60,.4); transition:.2s; }
    .play-btn:hover { transform:scale(1.05); }
    .visualizer { display:flex; align-items:flex-end; justify-content:center; gap:3px; height:44px; margin-bottom:14px; }
    .viz-bar { width:4px; height:8px; border-radius:2px; background:rgba(255,255,255,.32); }
    .volume { display:flex; align-items:center; gap:10px; color:#a0a0b0; font-size:.7rem; }
    .volume input { width:min(160px,52vw); accent-color:#e74c3c; }
  </style>
</head>
<body>
  <audio id="audio" src="/files/Allard%20Sidonia%20-%20Rain%20Without%20End.mp3" preload="metadata"></audio>
  <main class="player">
    <div class="album-art"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div>
    <div class="meta">
      <h1 class="song-title">Rain Without End</h1>
      <p class="artist">Allard Sidonia</p>
    </div>
    <div class="progress" id="progress"><div class="progress-fill" id="progressFill"></div></div>
    <div class="time-row"><span id="currentTime">0:00</span><span id="totalTime">0:00</span></div>
    <div class="controls">
      <button class="ctrl-btn" id="rewind" title="后退 10 秒"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <button class="play-btn" id="playBtn" title="播放"><svg id="playIcon" viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctrl-btn" id="forward" title="前进 10 秒"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
    </div>
    <div class="visualizer" id="visualizer"></div>
    <div class="volume"><span>音量</span><input id="volume" type="range" min="0" max="1" step="0.01" value="1"></div>
  </main>
  <script>
    const audio = document.getElementById('audio');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const progress = document.getElementById('progress');
    const progressFill = document.getElementById('progressFill');
    const currentTime = document.getElementById('currentTime');
    const totalTime = document.getElementById('totalTime');
    const visualizer = document.getElementById('visualizer');
    const bars = Array.from({ length: 15 }, () => {
      const bar = document.createElement('div');
      bar.className = 'viz-bar';
      visualizer.appendChild(bar);
      return bar;
    });
    let audioContext, analyser, frequencyData;

    const formatTime = (value) => {
      if (!Number.isFinite(value)) return '0:00';
      const seconds = Math.max(0, Math.floor(value));
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
    };

    function setPlayState(playing) {
      playIcon.innerHTML = playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
      playBtn.title = playing ? '暂停' : '播放';
    }

    async function togglePlay() {
      if (audio.paused) {
        await audio.play().catch(() => {});
      } else {
        audio.pause();
      }
    }

    function initAnalyser() {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass || audioContext) return;
      audioContext = new AudioContextClass();
      const source = audioContext.createMediaElementSource(audio);
      analyser = audioContext.createAnalyser();
      analyser.fftSize = 64;
      frequencyData = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);
      analyser.connect(audioContext.destination);
    }

    function drawVisualizer() {
      if (analyser) {
        analyser.getByteFrequencyData(frequencyData);
        bars.forEach((bar, index) => {
          const value = frequencyData[Math.floor(index * frequencyData.length / bars.length)] || 0;
          bar.style.height = `${Math.max(5, value / 255 * 44)}px`;
        });
      } else {
        bars.forEach((bar) => {
          bar.style.height = audio.paused ? '8px' : `${Math.random() * 34 + 8}px`;
        });
      }
      requestAnimationFrame(drawVisualizer);
    }

    playBtn.addEventListener('click', togglePlay);
    document.getElementById('rewind').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 10); });
    document.getElementById('forward').addEventListener('click', () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10); });
    document.getElementById('volume').addEventListener('input', (event) => { audio.volume = Number(event.target.value); });

    progress.addEventListener('click', (event) => {
      const rect = progress.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      if (Number.isFinite(audio.duration)) audio.currentTime = ratio * audio.duration;
    });

    audio.addEventListener('loadedmetadata', () => { totalTime.textContent = formatTime(audio.duration); });
    audio.addEventListener('timeupdate', () => {
      currentTime.textContent = formatTime(audio.currentTime);
      progressFill.style.width = `${audio.duration ? audio.currentTime / audio.duration * 100 : 0}%`;
    });
    audio.addEventListener('play', async () => {
      setPlayState(true);
      initAnalyser();
      await audioContext?.resume().catch(() => {});
    });
    audio.addEventListener('pause', () => setPlayState(false));
    audio.addEventListener('ended', () => { audio.currentTime = 0; });

    drawVisualizer();
  </script>
</body>
</html>
