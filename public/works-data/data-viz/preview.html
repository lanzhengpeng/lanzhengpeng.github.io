<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>DataViz</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,sans-serif; background:#0b0d10; color:#e8edf3; padding:20px; }
.title { font-size:1.2rem; margin-bottom:16px; color:#7aa9ff; }
.charts { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.chart-card { background:#151a23; border:1px solid #253045; border-radius:12px; padding:16px; }
.chart-card h4 { font-size:0.75rem; color:#94a3b8; margin-bottom:10px; }
.donut { width:100px; height:100px; border-radius:50%; margin:0 auto; position:relative; background:conic-gradient(#7aa9ff 0 45%, #22c55e 45% 75%, #f59e0b 75% 90%, #ef4444 90% 100%); }
.donut::after { content:''; position:absolute; inset:25px; border-radius:50%; background:#151a23; }
.line-chart { display:flex; align-items:flex-end; gap:4px; height:80px; }
.lc-bar { flex:1; background:linear-gradient(180deg,#22c55e,#15803d); border-radius:3px 3px 0 0; }
.heatmap { display:grid; grid-template-columns:repeat(12,1fr); gap:3px; }
.hm-cell { aspect-ratio:1; border-radius:2px; }
.stat-row { display:flex; gap:14px; margin-bottom:14px; }
.stat { flex:1; background:#151a23; border:1px solid #253045; border-radius:10px; padding:12px; }
.stat .v { font-size:1.4rem; font-weight:700; } .stat .l { font-size:0.65rem; color:#94a3b8; }
</style></head>
<body>
<div class="title">📊 DataViz Studio</div>
<div class="stat-row">
  <div class="stat"><div class="v">89.2K</div><div class="l">Events/min</div></div>
  <div class="stat"><div class="v">12ms</div><div class="l">Query Time</div></div>
  <div class="stat"><div class="v">99.9%</div><div class="l">Uptime</div></div>
</div>
<div class="charts">
  <div class="chart-card"><h4>Traffic Distribution</h4><div class="donut" style="cursor:pointer" onclick="this.style.transform='scale(1.1) rotate(45deg)';this.style.transition='all 0.4s';setTimeout(()=>this.style.transform='',400)"></div></div>
  <div class="chart-card"><h4>Revenue Trend</h4><div class="line-chart"><div class="lc-bar" style="height:30%"></div><div class="lc-bar" style="height:55%"></div><div class="lc-bar" style="height:40%"></div><div class="lc-bar" style="height:75%"></div><div class="lc-bar" style="height:60%"></div><div class="lc-bar" style="height:90%"></div><div class="lc-bar" style="height:80%"></div></div></div>
  <div class="chart-card"><h4>User Activity Heatmap</h4><div class="heatmap"><div class="hm-cell" style="background:#7aa9ff"></div><div class="hm-cell" style="background:#2563eb"></div><div class="hm-cell" style="background:#1e293b"></div><div class="hm-cell" style="background:#22c55e"></div><div class="hm-cell" style="background:#1e293b"></div><div class="hm-cell" style="background:#7aa9ff"></div><div class="hm-cell" style="background:#1e293b"></div><div class="hm-cell" style="background:#2563eb"></div><div class="hm-cell" style="background:#22c55e"></div><div class="hm-cell" style="background:#1e293b"></div><div class="hm-cell" style="background:#7aa9ff"></div><div class="hm-cell" style="background:#1e293b"></div><div class="hm-cell" style="background:#1e293b"></div><div class="hm-cell" style="background:#22c55e"></div><div class="hm-cell" style="background:#7aa9ff"></div><div class="hm-cell" style="background:#1e293b"></div><div class="hm-cell" style="background:#2563eb"></div><div class="hm-cell" style="background:#1e293b"></div><div class="hm-cell" style="background:#22c55e"></div><div class="hm-cell" style="background:#7aa9ff"></div><div class="hm-cell" style="background:#1e293b"></div><div class="hm-cell" style="background:#2563eb"></div><div class="hm-cell" style="background:#1e293b"></div><div class="hm-cell" style="background:#22c55e"></div></div></div>
  <div class="chart-card"><h4>Error Rate</h4><div class="line-chart"><div class="lc-bar" style="height:10%"></div><div class="lc-bar" style="height:20%"></div><div class="lc-bar" style="height:15%"></div><div class="lc-bar" style="height:30%"></div><div class="lc-bar" style="height:12%"></div><div class="lc-bar" style="height:8%"></div><div class="lc-bar" style="height:5%"></div></div></div>
</div>
<script>setInterval(()=>{document.querySelectorAll(".lc-bar").forEach(b=>{b.style.transition="height 0.5s";b.style.height=(Math.random()*70+20)+"%";});},2500);</script></body></html>
