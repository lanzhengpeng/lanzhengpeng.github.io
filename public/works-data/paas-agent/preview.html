<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>AI PaaS Studio</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'PingFang SC','Segoe UI',sans-serif; background:#F7F7F5; color:#1A1A1A; height:100%; display:flex; flex-direction:column; overflow:hidden; }
.app { display:flex; height:100vh; }
.left { width:34%; min-width:280px; border-right:1px solid #E8E8E6; display:flex; flex-direction:column; background:#FAFAF8; }
.left-top { display:flex; align-items:center; gap:4px; padding:10px 12px; border-bottom:1px solid #E8E8E6; flex-shrink:0; }
.icon-btn { width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#5A5A56; flex-shrink:0; }
.icon-btn:hover { background:#ECECEA; }
.project-name { display:flex; align-items:center; gap:4px; font-size:0.8rem; font-weight:600; color:#1A1A1A; padding:4px 8px; border-radius:6px; cursor:pointer; flex:1; min-width:0; }
.project-name:hover { background:#ECECEA; }
.project-name .chev { font-size:0.55rem; color:#8A8A86; }
.right-actions { display:flex; gap:2px; }
.chat-area { flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:88%; padding:10px 14px; border-radius:14px; font-size:0.78rem; line-height:1.65; }
.msg.user { align-self:flex-end; background:#E8E4F8; color:#1A1A1A; border-bottom-right-radius:4px; }
.msg.bot { align-self:flex-start; background:transparent; border:1px solid #E8E8E6; border-bottom-left-radius:4px; background:#fff; }
.msg .steps { margin-top:8px; font-size:0.68rem; }
.step { display:flex; align-items:center; gap:6px; padding:3px 0; color:#5A5A56; }
.step .dot { width:7px; height:7px; border-radius:50%; background:#22C55E; flex-shrink:0; }
.step.pending .dot { background:#D4D4D0; }
.step .label { font-weight:500; }
.chat-input-wrap { padding:12px 14px; flex-shrink:0; }
.chat-input { background:#fff; border:1px solid #E0E0DE; border-radius:14px; padding:12px 14px 10px; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
.chat-input .input-text { font-size:0.78rem; color:#8A8A86; margin-bottom:10px; }
.chat-input .toolbar { display:flex; align-items:center; gap:6px; }
.tool-btn { height:26px; min-width:26px; border-radius:6px; border:1px solid #E0E0DE; background:#FAFAF8; display:flex; align-items:center; justify-content:center; gap:3px; font-size:0.65rem; color:#5A5A56; cursor:pointer; padding:0 6px; }
.tool-btn.primary { background:#1A1A1A; color:#fff; border-color:#1A1A1A; width:28px; min-width:28px; }
.right { flex:1; display:flex; flex-direction:column; min-width:0; background:#F0F0EE; }
.tab-bar { display:flex; align-items:center; padding:8px 10px; gap:2px; background:#FAFAF8; border-bottom:1px solid #E8E8E6; flex-shrink:0; }
.tab-btn { display:flex; align-items:center; gap:5px; font-size:0.75rem; padding:5px 12px; border-radius:6px; cursor:pointer; color:#5A5A56; white-space:nowrap; }
.tab-btn.active { background:#fff; color:#1A1A1A; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,0.04); }
.tab-btn.dark { background:#1A1A1A; color:#fff; font-weight:600; margin-left:auto; border-radius:8px; padding:6px 16px; }
.canvas { flex:1; position:relative; display:flex; align-items:center; justify-content:center; min-height:0; }
.canvas-empty { text-align:center; color:#8A8A86; }
.canvas-empty .icon { font-size:2rem; margin-bottom:10px; opacity:0.4; }
.canvas-empty .title { font-size:0.85rem; margin-bottom:6px; }
.canvas-empty .err { font-size:0.75rem; color:#DC2626; margin-bottom:12px; }
.retry-btn { background:#1A1A1A; color:#fff; border:none; border-radius:8px; padding:8px 24px; font-size:0.78rem; cursor:pointer; }
.detail-panel { width:220px; background:#FAFAF8; border-left:1px solid #E8E8E6; display:flex; flex-direction:column; flex-shrink:0; }
.detail-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid #E8E8E6; font-size:0.78rem; font-weight:600; flex-shrink:0; }
.detail-body { flex:1; display:flex; align-items:center; justify-content:center; color:#B0B0AC; font-size:0.7rem; padding:14px; text-align:center; }
@keyframes spin { to { transform:rotate(360deg); } }
.spinning { animation:spin 1.2s linear infinite; }
</style></head>
<body>
<div class="app">
  <div class="left">
    <div class="left-top">
      <div class="icon-btn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></div>
      <div class="icon-btn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="18" height="4" rx="1"/><rect x="3" y="16" width="18" height="4" rx="1"/></svg></div>
      <div class="project-name"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#6C63FF" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>接口生成和规范</span><span class="chev">▼</span></div>
      <div class="right-actions">
        <div class="icon-btn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></div>
        <div class="icon-btn"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg></div>
      </div>
    </div>
    <div class="chat-area">
      <div class="msg user">帮我生成一个用户管理模块，包含注册、登录和查询接口</div>
      <div class="msg bot">
        好的，开始生成用户管理模块。
        <div class="steps">
          <div class="step"><span class="dot"></span><span class="label">架构设计</span> — 完成</div>
          <div class="step"><span class="dot"></span><span class="label">代码生成</span> — 3 个文件</div>
          <div class="step"><span class="dot"></span><span class="label">审查部署</span> — CSM 插件已加载</div>
          <div class="step pending"><span class="dot"></span><span class="label">API 文档生成中…</span></div>
        </div>
      </div>
      <div class="msg bot">✅ 用户管理模块已部署，共 3 个接口可用。</div>
    </div>
    <div class="chat-input-wrap">
      <div class="chat-input">
        <div class="input-text">输入任务或问题，例如：计算 2 + 3…</div>
        <div class="toolbar">
          <div class="tool-btn">＋</div>
          <div class="tool-btn"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>
          <div class="tool-btn">📖 技能 0</div>
          <div class="tool-btn">Auto ▾</div>
          <div style="flex:1"></div>
          <div class="tool-btn">🎤</div>
          <div class="tool-btn primary">↑</div>
        </div>
      </div>
    </div>
  </div>
  <div class="right">
    <div class="tab-bar">
      <div class="tab-btn">＋</div>
      <div class="tab-btn active"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/></svg> 预览</div>
      <div class="tab-btn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/></svg> 打包服务口</div>
      <div class="tab-btn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg> API 客户端</div>
      <div class="tab-btn dark">立即刷新</div>
    </div>
    <div class="canvas">
      <div class="canvas-empty">
        <div class="icon"><svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.3"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17h7M17 14v7" opacity="0.5"/></svg></div>
        <div class="title">无法加载系统架构</div>
        <div class="err">后端连接失败，正在重试…</div>
        <button class="retry-btn" onclick="this.textContent='重试中…'">重试</button>
      </div>
    </div>
  </div>
  <div class="detail-panel">
    <div class="detail-header">详情面板<span style="cursor:pointer;color:#8A8A86">✕</span></div>
    <div class="detail-body">点击画布上的节点<br>查看详细信息</div>
  </div>
</div>
</body></html>
