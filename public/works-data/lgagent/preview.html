<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LGagent Console</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body { width:100%; height:100%; overflow:hidden; }
    body { font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:#f0f2f5; color:#1f2937; font-size:clamp(12px,0.45vw + 10px,14px); -webkit-font-smoothing:antialiased; }
    .app { display:grid; grid-template-columns:clamp(180px,18%,250px) minmax(0,1fr); height:100%; }
    .sidebar { background:#001529; color:#fff; display:flex; flex-direction:column; overflow:hidden; }
    .brand { padding:clamp(12px,1.6vw,18px) clamp(14px,1.8vw,24px); border-bottom:1px solid rgba(255,255,255,.06); }
    .brand strong { display:block; font-size:clamp(16px,1.5vw,20px); color:#69b1ff; }
    .brand span { display:block; margin-top:4px; font-size:11px; color:rgba(255,255,255,.55); }
    .nav { flex:1; padding:clamp(8px,1.2vw,12px) 10px; display:flex; flex-direction:column; gap:4px; overflow-y:auto; }
    .nav button { display:flex; align-items:center; gap:10px; width:100%; min-width:0; padding:10px 12px; border:0; border-radius:6px; background:transparent; color:rgba(255,255,255,.72); font:inherit; text-align:left; cursor:pointer; transition:.2s; }
    .nav button span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .nav button:hover { background:rgba(255,255,255,.08); color:#fff; }
    .nav button.active { background:#1677ff; color:#fff; }
    .nav svg { flex-shrink:0; }
    .sidebar-foot { padding:clamp(10px,1.4vw,16px) clamp(14px,1.8vw,24px); border-top:1px solid rgba(255,255,255,.06); font-size:11px; color:rgba(255,255,255,.45); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .main { min-width:0; display:flex; flex-direction:column; overflow:hidden; }
    .header { min-height:56px; height:clamp(52px,6%,65px); background:#fff; border-bottom:1px solid #f0f0f0; padding:0 clamp(12px,1.8vw,24px); display:flex; align-items:center; justify-content:space-between; gap:12px; flex-shrink:0; }
    .header h1 { font-size:clamp(16px,1.7vw,20px); font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .header-right { display:flex; align-items:center; gap:10px; color:#667085; font-size:13px; }
    .pill { padding:5px 10px; border-radius:999px; background:#f0f7ff; color:#1677ff; border:1px solid #bae0ff; font-size:11px; font-weight:600; white-space:nowrap; }
    .content { flex:1; min-height:0; overflow:hidden; }
    .page { display:none; height:100%; overflow:hidden; }
    .page.active { display:flex; }
    .assistant { position:relative; width:100%; height:100%; background:radial-gradient(circle at 50% 18%, rgba(199,220,255,.56) 0%, rgba(238,245,255,.86) 18%, #fff 48%); display:grid; grid-template-rows:auto minmax(0,1fr); padding:clamp(10px,1.6vw,16px) clamp(12px,1.8vw,20px) clamp(56px,8%,72px); overflow:hidden; }
    .assistant-toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; min-width:0; flex-wrap:wrap; }
    .sessions { display:flex; align-items:center; gap:8px; overflow-x:auto; padding-bottom:4px; min-width:0; max-width:100%; }
    .session-chip { padding:8px 14px; border-radius:12px; border:1px solid #d9d9d9; background:#fff; white-space:nowrap; cursor:pointer; }
    .session-chip.active { border-color:#1677ff; color:#1677ff; background:#f0f7ff; }
    .round-btn, .reset-btn { height:36px; border-radius:12px; background:#fff; border:1px solid rgba(17,24,39,.08); box-shadow:0 8px 20px rgba(15,23,42,.06); font:inherit; cursor:pointer; }
    .round-btn { width:36px; display:inline-flex; align-items:center; justify-content:center; }
    .chat-area { position:relative; min-height:0; overflow:auto; }
    .msg { max-width:min(820px,100%); margin:0 auto 16px; }
    .bubble { padding:16px 20px; border-radius:16px; line-height:1.7; white-space:pre-wrap; box-shadow:0 8px 26px rgba(15,23,42,.05); }
    .user .bubble { margin-left:auto; width:fit-content; max-width:100%; background:#1677ff; color:#fff; border-bottom-right-radius:4px; }
    .bot .bubble { background:#fff; border-bottom-left-radius:4px; }
    .role { margin-bottom:6px; color:#667085; font-size:12px; }
    .trace { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; font-size:11px; color:#667085; }
    .trace span { padding:3px 7px; border-radius:6px; background:#f7f8fa; border:1px solid #f0f0f0; }
    .input-bar { position:absolute; left:12px; right:12px; bottom:12px; margin:auto; max-width:min(820px,calc(100% - 24px)); background:rgba(255,255,255,.92); border:1px solid rgba(15,23,42,.08); border-radius:999px; padding:8px 12px; display:flex; align-items:center; gap:10px; box-shadow:0 16px 40px rgba(15,23,42,.08); backdrop-filter:blur(14px); }
    .input-bar textarea { flex:1; min-height:38px; max-height:110px; border:0; outline:0; resize:none; background:transparent; font:inherit; color:#1f2937; }
    .model { color:#4b5563; font-size:12px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .send { width:36px; height:36px; border-radius:50%; border:0; background:#1677ff; color:#fff; display:inline-flex; align-items:center; justify-content:center; cursor:pointer; }
    .panel-page { width:100%; padding:clamp(12px,1.6vw,20px); overflow:auto; background:#fff; }
    .toolbar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px; flex-wrap:wrap; }
    .btn { height:32px; padding:0 14px; border-radius:6px; border:1px solid #d9d9d9; background:#fff; color:#1f2937; font:inherit; cursor:pointer; display:inline-flex; align-items:center; gap:6px; }
    .btn.primary { background:#1677ff; border-color:#1677ff; color:#fff; }
    .btn.danger { color:#ff4d4f; border-color:#ffccc7; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:clamp(10px,1.4vw,16px); }
    .card { min-width:0; border:1px solid #f0f0f0; border-radius:10px; padding:16px; box-shadow:0 4px 14px rgba(16,24,40,.04); cursor:pointer; transition:.2s; word-break:break-word; overflow-wrap:anywhere; }
    .card:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(16,24,40,.08); }
    .card h3 { font-size:clamp(14px,1.4vw,16px); margin-bottom:8px; min-width:0; overflow-wrap:anywhere; }
    .muted { color:#667085; font-size:12px; line-height:1.6; }
    .tag { display:inline-block; padding:2px 8px; border-radius:4px; font-size:11px; background:#f5f5f5; color:#555; }
    .tag.Critical,.tag.High { color:#ff4d4f; background:#fff1f0; }
    .tag.Medium { color:#faad14; background:#fffbe6; }
    .tag.Low { color:#52c41a; background:#f6ffed; }
    .tag.ok { color:#52c41a; background:#f6ffed; }
    .tag.live { color:#1677ff; background:#f0f7ff; }
    .actions { display:flex; gap:8px; margin-top:12px; }
    .detail { margin-top:16px; padding:16px; border-radius:10px; background:#fafafa; border:1px solid #f0f0f0; display:none; }
    .detail.open { display:block; }
    .detail h4 { margin-bottom:10px; }
    .code { padding:12px; border-radius:8px; background:#181d29; color:#d1e4ff; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; white-space:pre-wrap; overflow:auto; }
    .doc-layout { display:grid; grid-template-columns:clamp(220px,30%,320px) minmax(0,1fr); height:100%; background:#fff; }
    .doc-list { border-right:1px solid #f0f0f0; display:flex; flex-direction:column; min-height:0; }
    .doc-head { padding:clamp(10px,1.5vw,16px) clamp(12px,1.7vw,20px); border-bottom:1px solid #f0f0f0; }
    .doc-body { flex:1; overflow:auto; }
    .doc-item { padding:14px 16px; border-left:3px solid transparent; cursor:pointer; }
    .doc-item.active { border-left-color:#1677ff; background:#f5f8ff; }
    .doc-view { display:flex; flex-direction:column; min-height:0; }
    .doc-view-head { padding:clamp(10px,1.5vw,16px) clamp(12px,1.7vw,20px); border-bottom:1px solid #f0f0f0; }
    .doc-view-body { flex:1; overflow:auto; padding:clamp(12px,1.7vw,20px) clamp(14px,2vw,24px); line-height:1.8; white-space:pre-wrap; word-break:break-word; }
    .empty { display:grid; place-items:center; height:100%; color:#98a2b3; }
    .spinner { position:absolute; left:50%; top:50%; width:36px; height:36px; margin:-18px 0 0 -18px; border:3px solid rgba(22,119,255,.18); border-top-color:#1677ff; border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .switch { width:40px; height:20px; border-radius:999px; background:#d9d9d9; border:0; position:relative; cursor:pointer; }
    .switch.on { background:#1677ff; }
    .switch::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:.2s; }
    .switch.on::after { transform:translateX(20px); }
    @media (max-width:800px) {
      .app { grid-template-columns:64px minmax(0,1fr); }
      .brand strong, .brand span, .nav button span, .sidebar-foot { display:none; }
      .nav button { justify-content:center; padding:10px; }
      .header-right span:last-child { display:none; }
      .assistant-toolbar { align-items:stretch; }
      .sessions { flex:1 1 100%; }
      .assistant > .assistant-toolbar + div { flex:1; }
      .doc-layout { grid-template-columns:1fr; grid-template-rows:minmax(160px,38%) minmax(0,1fr); }
      .doc-list { border-right:0; border-bottom:1px solid #f0f0f0; }
      .input-bar .model { display:none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><strong>LGagent</strong><span>智能运维助手</span></div>
      <nav class="nav" id="nav">
        <button data-page="assistant" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span>系统问答</span></button>
        <button data-page="logs"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h6M7 16h8"/></svg><span>日志节点</span></button>
        <button data-page="todos"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 1 6 6v3l2 3H4l2-3V9a6 6 0 0 1 6-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span>需处理卡片</span></button>
        <button data-page="tasks"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg><span>任务清单</span></button>
        <button data-page="knowledge"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg><span>知识库</span></button>
        <button data-page="tools"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a4 4 0 1 0 5 5L21 12l-9 9-3-3 9-9z"/><path d="M7 17l-4-4 4-4 4 4"/></svg><span>工具管理</span></button>
      </nav>
      <div class="sidebar-foot">Local Demo</div>
    </aside>
    <main class="main">
      <header class="header">
        <h1 id="pageTitle">LLM 沟通窗口</h1>
        <div class="header-right"><span class="pill">API</span><span>在线演示</span></div>
      </header>
      <section class="content">
        <div class="page active" data-panel="assistant">
          <div class="assistant">
            <div class="assistant-toolbar">
              <div class="sessions" id="sessions"></div>
              <div style="display:flex; gap:10px;">
                <button class="round-btn" id="newSession" title="新建会话">＋</button>
                <button class="reset-btn" id="resetSession">重置</button>
              </div>
            </div>
            <div class="chat-area" id="chatArea"><div class="spinner"></div></div>
            <div class="input-bar">
              <textarea id="promptInput" rows="1" placeholder="输入运维问题，Agent 将进行工具调用和回答"></textarea>
              <span class="model">LatentGuard</span>
              <button class="send" id="sendBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
            </div>
          </div>
        </div>
        <div class="page" data-panel="logs"><div class="panel-page" id="logsPanel"><div class="spinner"></div></div></div>
        <div class="page" data-panel="todos"><div class="panel-page" id="todosPanel"><div class="spinner"></div></div></div>
        <div class="page" data-panel="tasks"><div class="panel-page" id="tasksPanel"><div class="spinner"></div></div></div>
        <div class="page" data-panel="knowledge">
          <div class="doc-layout">
            <aside class="doc-list">
              <div class="doc-head"><strong>知识库文档</strong><div class="muted" id="knowledgeStatus">加载中</div></div>
              <div class="doc-body" id="documentList"><div class="spinner"></div></div>
            </aside>
            <div class="doc-view">
              <div class="doc-view-head"><strong id="documentTitle">文档内容</strong><div class="muted" id="documentMeta">选择左侧文档查看内容</div></div>
              <div class="doc-view-body" id="documentContent">暂无可显示文档</div>
            </div>
          </div>
        </div>
        <div class="page" data-panel="tools"><div class="panel-page" id="toolsPanel"><div class="spinner"></div></div></div>
      </section>
    </main>
  </div>
  <script src="mock-api.js"></script>
  <script>
    const api = window.LGAgentMockApi;
    const titles = { assistant:'LLM 沟通窗口', logs:'日志监控节点', todos:'需处理任务卡片队列', tasks:'任务清单', knowledge:'知识库', tools:'LLM 工具管理' };
    const state = { sessions:[], activeSessionId:'', documents:[], nodes:[], todos:[], tasks:[] };
    const el = (id) => document.getElementById(id);

    el('nav').addEventListener('click', (event) => {
      const button = event.target.closest('[data-page]');
      if (!button) return;
      document.querySelectorAll('.nav button').forEach((item) => item.classList.toggle('active', item === button));
      document.querySelectorAll('.page').forEach((item) => item.classList.toggle('active', item.dataset.panel === button.dataset.page));
      el('pageTitle').textContent = titles[button.dataset.page];
    });

    function renderSessions() {
      el('sessions').innerHTML = state.sessions.map((session) => `<button class="session-chip ${session.id === state.activeSessionId ? 'active' : ''}" data-session="${session.id}">${session.title}</button>`).join('');
    }

    function renderMessages() {
      const session = state.sessions.find((item) => item.id === state.activeSessionId);
      if (!session || !session.messages.length) { el('chatArea').innerHTML = '<div class="empty">暂无消息，试试输入一个运维问题</div>'; return; }
      el('chatArea').innerHTML = session.messages.map((message) => `
        <div class="msg ${message.role === 'user' ? 'user' : 'bot'}">
          <div class="role">${message.role === 'user' ? '用户' : 'Assistant'}</div>
          ${message.trace?.length ? `<div class="trace">${message.trace.map((item) => `<span>${item.label}：${item.text}</span>`).join('')}</div>` : ''}
          <div class="bubble">${message.content.replace(/</g, '&lt;')}</div>
        </div>`).join('');
      el('chatArea').scrollTop = el('chatArea').scrollHeight;
    }

    async function loadSessions() {
      state.sessions = await (await api.request('/chat/sessions')).json();
      state.activeSessionId = state.sessions[0]?.id || '';
      renderSessions(); renderMessages();
    }

    function renderNodes() {
      el('logsPanel').innerHTML = `
        <div class="toolbar"><div><strong>节点监控</strong><div class="muted">连接节点后可读取日志与 Agent 事件</div></div><button class="btn primary" onclick="showAgentStream()">模拟 Agent 事件</button></div>
        <div class="grid">${state.nodes.map((node) => `
          <div class="card" onclick="selectNode(${node.id})">
            <h3>${node.name} <span class="tag ${node.status === 'monitoring' ? 'live' : 'ok'}">${node.status}</span></h3>
            <div class="muted">${node.host}:${node.port} · ${node.username}</div>
            <div class="muted">${node.description || node.target || ''}</div>
            <div class="actions">
              <button class="btn" onclick="event.stopPropagation(); toggleNode(${node.id})">${node.status === 'monitoring' ? '停止' : '连接'}</button>
              <button class="btn danger" onclick="event.stopPropagation(); deleteNode(${node.id})">删除</button>
            </div>
          </div>`).join('')}
        </div><div class="detail" id="nodeDetail"></div>`;
    }

    function renderTodos() {
      el('todosPanel').innerHTML = `
        <div class="toolbar"><div><strong>待处理故障卡片</strong><div class="muted">点击卡片查看根因与修复建议</div></div><button class="btn" onclick="loadTodos()">刷新</button></div>
        ${state.todos.length ? `<div class="grid">${state.todos.map((todo) => `
          <div class="card" onclick="showTodo(${todo.id})">
            <div style="display:flex; justify-content:space-between;"><h3>${todo.summary}</h3><span class="tag ${todo.level}">${todo.level}</span></div>
            <div class="muted">${todo.project} · ${todo.server}</div>
            <div class="muted">${todo.ai_cause || '等待 AI 生成根因'}</div>
            <div class="actions"><button class="btn primary" onclick="event.stopPropagation(); resolveTodo(${todo.id})">标记完成</button></div>
          </div>`).join('')}</div>` : '<div class="empty">当前没有待处理卡片</div>'}
        <div class="detail" id="todoDetail"></div>`;
    }

    function renderTasks() {
      el('tasksPanel').innerHTML = `
        <div class="toolbar"><div><strong>任务清单</strong><div class="muted">LLM 生成的任务可以在这里跟踪</div></div><button class="btn" onclick="loadTasks()">刷新</button></div>
        <div class="grid">${state.tasks.map((task) => `
          <div class="card"><h3>${task.title}</h3><div class="muted">${task.details || '暂无详情'}</div>
          <div style="margin:10px 0;"><span class="tag ${task.priority}">${task.priority}</span> <span class="tag">${task.status}</span> <span class="tag">${task.source}</span></div>
          <div class="actions"><button class="btn" onclick="toggleTask(${task.id})">${task.status === 'done' ? '重开' : '完成'}</button><button class="btn danger" onclick="deleteTask(${task.id})">删除</button></div></div>`).join('')}
        </div>`;
    }

    function renderDocuments() {
      el('documentList').innerHTML = state.documents.map((doc) => `
        <div class="doc-item" data-doc="${doc.filename}">
          <strong>${doc.filename}</strong> <span class="tag">${doc.suffix}</span>
          <div class="muted">${(doc.size_bytes / 1024).toFixed(1)} KB</div>
        </div>`).join('');
      el('documentList').onclick = async (event) => {
        const item = event.target.closest('[data-doc]');
        if (!item) return;
        document.querySelectorAll('.doc-item').forEach((node) => node.classList.toggle('active', node === item));
        const data = await (await api.request(`/knowledge/documents/${encodeURIComponent(item.dataset.doc)}`)).json();
        el('documentTitle').textContent = data.document?.filename || '文档内容';
        el('documentMeta').textContent = data.document?.relative_path || '';
        el('documentContent').textContent = data.content || '暂无内容';
      };
      if (state.documents[0]) el('documentList').querySelector('[data-doc]')?.click();
    }

    function renderTools(tools) {
      el('toolsPanel').innerHTML = `
        <div class="toolbar"><div><strong>LLM 工具</strong><div class="muted">关闭后的工具不会注入下一次 Agent 会话</div></div><button class="btn" onclick="loadTools()">刷新</button></div>
        <div class="grid">${tools.map((tool) => `
          <div class="card"><div style="display:flex; justify-content:space-between; gap:10px;"><h3>${tool.name}</h3><button class="switch ${tool.enabled ? 'on' : ''}" onclick="toggleTool('${tool.name}', this)"></button></div>
          <div class="muted">${tool.description || '暂无描述'}</div><div class="muted">${tool.source_type}${tool.path ? ` · ${tool.method} ${tool.path}` : ''}</div></div>`).join('')}
        </div>`;
    }

    async function loadTodos() { state.todos = await (await api.request('/todos/')).json(); renderTodos(); }
    async function loadTasks() { state.tasks = await (await api.request('/task-list/')).json(); renderTasks(); }
    async function loadNodes() { state.nodes = await (await api.request('/servers/nodes')).json(); renderNodes(); }
    async function loadTools() { renderTools(await (await api.request('/api/tools/')).json()); }

    async function loadKnowledge() {
      const documents = await (await api.request('/knowledge/documents')).json();
      const status = await (await api.request('/knowledge/status')).json();
      state.documents = documents.documents;
      el('knowledgeStatus').textContent = `共 ${state.documents.length} 份 · ${status.status.points_count} 个向量点`;
      renderDocuments();
    }

    window.selectNode = async (id) => {
      const node = state.nodes.find((item) => item.id === id);
      const detail = el('nodeDetail'); detail.classList.add('open');
      detail.innerHTML = `<h4>${node.name} 事件流</h4><div class="code">event: status\ndata: {"status":"monitoring","message":"已连接 ${node.host}"}</div>`;
    };
    window.showAgentStream = async () => {
      const node = state.nodes[0]; if (!node) return;
      const response = await api.createChatStream({ sessionId: state.activeSessionId, content: `检查 ${node.name} 的最新异常日志` });
      const text = await response.text();
      el('nodeDetail').classList.add('open');
      el('nodeDetail').innerHTML = `<h4>${node.name} Agent 事件流</h4><div class="code">${text.replace(/</g, '&lt;')}</div>`;
      loadSessions();
    };
    window.toggleNode = async (id) => { const node = state.nodes.find((item) => item.id === id); node.status = node.status === 'monitoring' ? 'connected' : 'monitoring'; renderNodes(); };
    window.deleteNode = async (id) => { state.nodes = state.nodes.filter((item) => item.id !== id); renderNodes(); };
    window.showTodo = (id) => {
      const todo = state.todos.find((item) => item.id === id); const detail = el('todoDetail'); detail.classList.add('open');
      detail.innerHTML = `<h4>卡片详情：ID-${todo.id}</h4><div class="code">${todo.raw_log.replace(/</g, '&lt;')}</div><p class="muted" style="margin-top:12px;"><strong>建议：</strong>${todo.suggestion || '暂无'}</p>`;
    };
    window.resolveTodo = async (id) => { await api.request(`/todos/${id}/status`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:'resolved'}) }); await loadTodos(); };
    window.toggleTask = async (id) => { const task = state.tasks.find((item) => item.id === id); await api.request(`/task-list/${id}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status:task.status === 'done' ? 'pending' : 'done'}) }); await loadTasks(); };
    window.deleteTask = async (id) => { await api.request(`/task-list/${id}`, { method:'DELETE' }); await loadTasks(); };
    window.toggleTool = async (name, button) => { const enabled = !button.classList.contains('on'); button.classList.toggle('on', enabled); await api.request(`/api/tools/${encodeURIComponent(name)}`, { method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({enabled}) }); };

    async function sendMessage() {
      const input = el('promptInput'); const content = input.value.trim(); if (!content) return;
      input.value = ''; const session = state.sessions.find((item) => item.id === state.activeSessionId);
      session.messages.push({ id:`local_${Date.now()}`, role:'user', content, created_at:new Date().toISOString() });
      renderMessages();
      await api.createChatStream({ sessionId: state.activeSessionId, content }).then((response) => response.text());
      const fresh = await (await api.request(`/chat/sessions/${state.activeSessionId}`)).json();
      Object.assign(session, fresh); renderSessions(); renderMessages();
    }

    el('sendBtn').addEventListener('click', sendMessage);
    el('promptInput').addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); } });
    el('newSession').addEventListener('click', async () => {
      const session = await (await api.request('/chat/sessions', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title:'新对话'}) })).json();
      state.sessions.unshift(session); state.activeSessionId = session.id; renderSessions(); renderMessages();
    });
    el('sessions').addEventListener('click', (event) => {
      const button = event.target.closest('[data-session]'); if (!button) return;
      state.activeSessionId = button.dataset.session; renderSessions(); renderMessages();
    });
    el('resetSession').addEventListener('click', async () => { await loadSessions(); });

    (async () => {
      await Promise.all([loadSessions(), loadNodes(), loadTodos(), loadTasks(), loadKnowledge(), loadTools()]);
      document.querySelectorAll('.spinner').forEach((item) => item.remove());
    })();
  </script>
</body>
</html>
