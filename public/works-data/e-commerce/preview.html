<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StoreMate</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,sans-serif; background:#fafafa; color:#1a1a2e; height:100vh; display:flex; flex-direction:column; }
.search-bar { background:#fff; padding:12px 16px; display:flex; align-items:center; gap:8px; border-bottom:1px solid #eee; }
.search-bar input { flex:1; background:#f0f0f5; border:none; border-radius:20px; padding:10px 16px; font-size:0.8rem; outline:none; }
.banner { background:linear-gradient(135deg,#667eea,#764ba2); margin:12px 16px; border-radius:12px; padding:20px; color:#fff; }
.banner h2 { font-size:1.1rem; margin-bottom:4px; } .banner p { font-size:0.75rem; opacity:0.9; }
.categories { display:flex; gap:12px; padding:0 16px; margin:8px 0; overflow-x:auto; }
.cat { min-width:60px; text-align:center; font-size:0.7rem; color:#666; }
.cat-icon { width:44px; height:44px; border-radius:12px; background:#f0f0f5; display:flex; align-items:center; justify-content:center; font-size:1.2rem; margin-bottom:4px; }
.section-title { font-size:0.9rem; font-weight:600; padding:8px 16px; }
.products { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:0 16px; flex:1; overflow-y:auto; padding-bottom:70px; }
.product-card { background:#fff; border-radius:12px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
.product-img { height:90px; display:flex; align-items:center; justify-content:center; font-size:2.2rem; }
.p1{background:#ffe0e0}.p2{background:#e0f0ff}.p3{background:#fff3e0}.p4{background:#e8ffe0}
.product-info { padding:8px 10px; }
.product-name { font-size:0.7rem; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.product-price { font-size:0.85rem; font-weight:700; color:#e74c3c; }
.product-price small { font-size:0.6rem; color:#999; font-weight:400; text-decoration:line-through; margin-left:4px; }
.tab-bar { position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #eee; display:flex; justify-content:space-around; padding:8px 0; font-size:0.6rem; color:#999; }
.tab-bar .active { color:#667eea; }
.tab { display:flex; flex-direction:column; align-items:center; gap:2px; }
.tab span { font-size:1.1rem; }
</style></head>
<body>
<div class="search-bar"><input placeholder="🔍 搜索商品..."></div>
<div class="banner"><h2>限时秒杀 🔥</h2><p>全场低至 1 折起</p></div>
<div class="categories">
  <div class="cat"><div class="cat-icon">📱</div>数码</div>
  <div class="cat"><div class="cat-icon">👗</div>服饰</div>
  <div class="cat"><div class="cat-icon">🏠</div>家居</div>
  <div class="cat"><div class="cat-icon">🍜</div>食品</div>
  <div class="cat"><div class="cat-icon">💄</div>美妆</div>
</div>
<div class="section-title">热销推荐</div>
<div class="products">
  <div class="product-card"><div class="product-img p1">🎧</div><div class="product-info"><div class="product-name">无线降噪耳机 Pro</div><div class="product-price">¥299 <small>¥899</small></div></div></div>
  <div class="product-card"><div class="product-img p2">⌚</div><div class="product-info"><div class="product-name">智能手表 S9</div><div class="product-price">¥1,299 <small>¥2,499</small></div></div></div>
  <div class="product-card"><div class="product-img p3">📦</div><div class="product-info"><div class="product-name">多功能收纳盒</div><div class="product-price">¥49 <small>¥99</small></div></div></div>
  <div class="product-card"><div class="product-img p4">🌱</div><div class="product-info"><div class="product-name">桌面绿植套装</div><div class="product-price">¥39 <small>¥69</small></div></div></div>
</div>
<div class="tab-bar"><div class="tab active"><span>🏠</span>首页</div><div class="tab"><span>🏷️</span>分类</div><div class="tab" id="cartTab"><span>🛒</span>购物车</div><div class="tab"><span>👤</span>我的</div></div>
<script>let cartCount=0;document.querySelectorAll(".product-card").forEach(c=>{c.style.cursor="pointer";c.addEventListener("click",()=>{cartCount++;document.querySelector("#cartTab").innerHTML="<span>🛒</span>购物车("+cartCount+")";c.style.transform="scale(0.95)";setTimeout(()=>c.style.transform="",150);if(navigator.vibrate)navigator.vibrate(10);});});document.querySelectorAll(".tab").forEach(t=>{t.addEventListener("click",()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");});});</script></body></html>
