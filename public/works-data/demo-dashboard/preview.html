<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Dashboard</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #0f172a;
  color: #e8edf3;
  padding: 20px;
  min-height: 100vh;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.header h1 { font-size: 1.4rem; color: #7aa9ff; }
.status-badge {
  background: #065f46;
  color: #6ee7b7;
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 0.75rem;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 14px;
}
.stat-card .label { font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px; }
.stat-card .value { font-size: 1.5rem; font-weight: 700; color: #f0f4ff; }
.stat-card .trend { font-size: 0.65rem; margin-top: 4px; }
.trend.up { color: #6ee7b7; }
.trend.down { color: #f87171; }
.chart-section {
  background: #1e293b;
  border: 1px solid #334155;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 14px;
}
.chart-section h3 { font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; }
.bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 80px; }
.bar {
  flex: 1;
  background: linear-gradient(180deg, #7aa9ff, #2563eb);
  border-radius: 4px 4px 0 0;
  min-width: 20px;
}
.log-list { list-style: none; }
.log-list li {
  display: flex;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid #1e293b;
  font-size: 0.7rem;
  font-family: monospace;
}
.log-time { color: #475569; min-width: 60px; }
.log-type { color: #7aa9ff; min-width: 50px; }
.log-msg { color: #cbd5e1; }
</style>
</head>
<body>
<div class="header">
  <h1>🤖 Agent Dashboard</h1>
  <span class="status-badge">● Running</span>
</div>
<div class="stats-grid">
  <div class="stat-card">
    <div class="label">Tool Calls</div>
    <div class="value">1,247</div>
    <div class="trend up">↑ 12%</div>
  </div>
  <div class="stat-card">
    <div class="label">Avg Latency</div>
    <div class="value">342ms</div>
    <div class="trend down">↓ 8%</div>
  </div>
  <div class="stat-card">
    <div class="label">Success Rate</div>
    <div class="value">98.2%</div>
    <div class="trend up">↑ 0.5%</div>
  </div>
</div>
<div class="chart-section">
  <h3>Token Usage (7d)</h3>
  <div class="bar-chart">
    <div class="bar" style="height:40%"></div>
    <div class="bar" style="height:65%"></div>
    <div class="bar" style="height:50%"></div>
    <div class="bar" style="height:80%"></div>
    <div class="bar" style="height:55%"></div>
    <div class="bar" style="height:90%"></div>
    <div class="bar" style="height:70%"></div>
  </div>
</div>
<div class="chart-section">
  <h3>Recent Activity</h3>
  <ul class="log-list">
    <li><span class="log-time">10:23:41</span><span class="log-type">tool</span><span class="log-msg">web_search → 3 results</span></li>
    <li><span class="log-time">10:23:38</span><span class="log-type">llm</span><span class="log-msg">gpt-4o · 284 tokens</span></li>
    <li><span class="log-time">10:23:35</span><span class="log-type">tool</span><span class="log-msg">calculator → 42</span></li>
    <li><span class="log-time">10:23:30</span><span class="log-type">llm</span><span class="log-msg">ReAct step 3: observe</span></li>
  </ul>
</div>
</body>
</html>
